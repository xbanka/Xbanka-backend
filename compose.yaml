services:
  server:
    build:
      context: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: always
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18
    restart: always
    volumes:
      - dbdata:/var/lib/postgresql
    env_file:
      - .env
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  dbdata: