services:
  server:
    build:
      context: .
    restart: always
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18
    restart: always
    volumes:
      - dbdata:/var/lib/postgresql
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  dbdata: