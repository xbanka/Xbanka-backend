services:
  server:
    ports:
      - "8001:8000"
    env_file:
      - .env.staging
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  db:
    env_file:
      - .env.staging
    ports:
      - "5434:5432"
    
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.staging
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["alembic", "upgrade", "head"]
    restart: "no"

volumes:
  dbdata_staging:
